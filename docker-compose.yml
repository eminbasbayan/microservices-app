services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-container
    restart: unless-stopped
    environment:
      PORT: ${USER_SERVICE_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${USER_MONGODB_URI:-mongodb://mongodb:27017/user-service}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service-container
    restart: unless-stopped
    environment:
      PORT: ${ORDER_SERVICE_PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${ORDER_MONGODB_URI:-mongodb://mongodb:27017/order-service}
    depends_on:
      mongodb:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-network

  mongodb:
    image: mongo:7
    container_name: mongodb-container
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-network

  product-mysql:
    image: mysql:8.4
    container_name: product-mysql-container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-product_service}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD gerekli}
      MYSQL_USER: ${MYSQL_USER:-product_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD gerekli}
    volumes:
      - product-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service-container
    restart: unless-stopped
    environment:
      PORT: ${PRODUCT_SERVICE_PORT:-3003}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-product-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-product_service}
      DB_USER: ${MYSQL_USER:-product_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD gerekli}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-10}
      DB_RETRY_DELAY_MS: ${DB_RETRY_DELAY_MS:-3000}
    depends_on:
      product-mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-container
    restart: unless-stopped
    environment:
      PORT: ${API_GATEWAY_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3001}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:3002}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3003}
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-network

volumes:
  mongo-data:
  product-mysql-data:

networks:
  my-network:
    name: my-network